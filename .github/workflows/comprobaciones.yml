name: MACROLIGA - comprobaciones de codigo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Leer repositorio MACROLIGA
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias del motor
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Comprobar sintaxis
        run: npm run check
      - name: Ejecutar pruebas locales
        run: npm test
      - name: Simular las 16 cuentas historicas sin credenciales
        run: npm run demo:preview
  postgres-clausulas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-macroliga-only
          POSTGRES_DB: macroliga_clause_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d macroliga_clause_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Leer repositorio MACROLIGA
        uses: actions/checkout@v4
      - name: Verificar SQL en PostgreSQL desechable
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGDATABASE: macroliga_clause_test
          PGUSER: postgres
          PGPASSWORD: fixture-macroliga-only
        run: bash tests/sql/verificar_clausulas_ci.sh
